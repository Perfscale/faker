# Minimal example: call the library's functions from ${hello.fn(...)} tokens.
# `${...}` generator tokens expand in action payloads (http body here);
# std/log then prints the values httpbin echoed back.
steps:
  - name: send generated values over http
    use: std/http@v1
    with:
      method: POST
      url: https://httpbin.org/post
      body:
        greeting: "${hello.greet(perfscale)}"
        # token(order) twice in one message → one value (per-message memo);
        # token() with no key is always fresh.
        order_id: "${hello.token(order)}"
        order_echo: "${hello.token(order)}"
        fresh: "${hello.token()}"
    check:
      status: 200
      body_contains: "hello, perfscale!"
    outputs: resp

  - name: show what the library generated
    use: std/log@v1
    with:
      # std/log resolves ${{ }} step outputs, not ${...} generator tokens.
      message: "httpbin saw: ${{ resp.body }}"
