name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (wasm target)
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: unit tests (host, no wasm runtime needed)
        run: cargo test

      - name: build component
        run: cargo build --release --target wasm32-wasip2

      - uses: actions/upload-artifact@v4
        with:
          name: hello-wasm
          path: target/wasm32-wasip2/release/hello.wasm

  integration:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: build component
        run: cargo build --release --target wasm32-wasip2

      - name: download perfscale v0.21.0
        run: |
          curl -sSfL -o perfscale \
            https://github.com/Perfscale/perfscale/releases/download/v0.21.0/perfscale-linux-amd64
          chmod +x perfscale
          ./perfscale --version

      - name: lint the example
        # lint resolves library `use:` paths relative to the cwd, so run it
        # from examples/ (run resolves them relative to the declaring file).
        working-directory: examples
        run: ../perfscale lint test.yaml config.yaml

      - name: run the example
        working-directory: examples
        run: ../perfscale run -f test.yaml -c config.yaml
