name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # attach artifacts to the GitHub release
  packages: write # push ghcr.io/perfscale/faker

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: unit tests
        run: cargo test

      - name: build component
        run: cargo build --release --target wasm32-wasip2

      - name: package
        run: |
          mkdir dist
          cp target/wasm32-wasip2/release/faker.wasm dist/
          (cd dist && sha256sum faker.wasm > faker.wasm.sha256)

      - name: attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/faker.wasm
            dist/faker.wasm.sha256

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags: the git tag without the leading v, plus latest.
      - name: compute image tags
        run: |
          tag="${GITHUB_REF_NAME#v}"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "ghcr.io/perfscale/faker:${tag}"
            echo "ghcr.io/perfscale/faker:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # The artifact image is FROM scratch with no RUN, so no QEMU emulation
      # is needed to build for both architectures.
      - name: build and push ghcr.io/perfscale/faker
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: docker/artifact.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
